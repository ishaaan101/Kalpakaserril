<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trend Store</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    header { background: #222; color: #fff; padding: 20px; text-align: center; font-size: 28px; }
    .product-list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
    .product { background: #fff; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; }
    .product h2 { margin: 10px 0 5px; font-size: 20px; }
    .product p { margin: 5px 0; font-size: 16px; }
    .btn { display: inline-block; margin-top: 10px; padding: 10px 15px; background: #25D366; color: white; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>
  <header>Trend Store</header>
  <div class="product-list">
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Men%27s+Shirt" alt="Men's Shirt">
      <h2>Men's Casual Shirt</h2>
      <p>₹599</p>
      <p>Cotton, Slim Fit</p>
      <a href="https://wa.me/919281822" class="btn" target="_blank">Order on WhatsApp</a>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Ladies+Kurti" alt="Ladies Kurti">
      <h2>Ladies Kurti</h2>
      <p>₹499</p>
      <p>Printed, Rayon</p>
      <a href="https://wa.me/919281822" class="btn" target="_blank">Order on WhatsApp</a>
    </div>
  </div>
</body>
</html>
